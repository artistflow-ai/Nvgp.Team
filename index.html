<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NVGP STUDIO — The Artist District</title>
<meta name="description" content="NVGP STUDIO: strumenti e community per artisti rap, trap e urban emergenti.">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/studio.css">
<script src="js/config.js"></script>
</head><body>
<header class="bar"><a class="logo" href="#/">NVGP<b>STUDIO</b></a>
<button class="burger" aria-label="Menu" aria-expanded="false"><i></i><i></i></button>
<nav id="nav"><a href="#/radar">Release Radar</a><a href="#/directory">Directory</a><a href="#/promotion">Promotion</a>
<a href="#/dashboard">Dashboard</a><a href="#/planner">Planner</a><a href="#/presskit">Press kit</a>
<a href="../" class="ext">Magazine NVGP TEAM</a><a href="#/auth" id="authLink" class="cta">Accedi</a></nav></header>
<main id="app" tabindex="-1"></main>
<footer><b>NVGP STUDIO</b> — YOUR SOUND. YOUR WORLD.<span>Nessun risultato o numero di stream è garantito. <a href="../">NVGP TEAM</a> · <a href="https://www.instagram.com/nvgp.team/">Instagram</a></span></footer>
<div id="toast" role="status" aria-live="polite"></div>

<template id="v-home">
<section class="hero"><p class="tag">NVGP STUDIO presenta</p>
<h1><span>THE</span><span class="g">ARTIST</span><span>DISTRICT</span></h1>
<p class="lead">YOUR SOUND. YOUR WORLD. Profilo, calendario uscite e press kit per artisti rap, trap e urban emergenti. Gratis, nel quartiere di chi la musica la fa.</p>
<div class="row"><a class="btn" href="#/auth">Entra nel distretto</a><a class="btn o" href="#/directory">Sfoglia gli artisti</a></div></section>
<section class="grid3">
<a class="card ph" href="#/directory"><em>Artist Spotlight</em><h3>Gli artisti del distretto</h3><p>Profili pubblici, approvati dalla redazione.</p></a>
<a class="card ph" href="#/radar"><em>Release Radar</em><h3>Le prossime uscite</h3><p>Cosa esce, quando, da chi.</p></a>
<a class="card ph" href="#/promotion"><em>Promotion</em><h3>Servizi NVGP TEAM</h3><p>Richiedi informazioni o candidati.</p></a></section>
<section class="split"><div><h2>Playlist</h2><p>Sostituisci l'ID in <code>js/config.js</code> con la tua playlist Spotify.</p></div><div id="pl"></div></section>
<section class="split inv"><div><h2>Il magazine</h2><p>Interviste, recensioni e scena. Il magazine NVGP TEAM resta il cuore del progetto.</p></div><a class="btn" href="../">Vai a NVGP TEAM</a></section>
</template>

<template id="v-auth"><section class="narrow"><h2>Accedi o registrati</h2><p id="cfgWarn" class="warn" hidden>Supabase non è ancora configurato: vedi README, sezione 1.</p>
<form id="authForm"><label>Email<input name="email" type="email" required autocomplete="email"></label>
<label>Password<input name="password" type="password" minlength="8" required autocomplete="current-password"></label>
<div class="row"><button class="btn" data-m="in">Accedi</button><button class="btn o" data-m="up">Registrati</button></div>
<button type="button" class="lnk" id="reset">Password dimenticata?</button></form></section></template>

<template id="v-dashboard"><section><h2>Dashboard</h2><div id="gate"></div>
<form id="profForm" class="cols" hidden>
<label>Nome artistico<input name="stage_name" required maxlength="60"></label>
<label>Genere<input name="genre" placeholder="Trap, Drill, Boom bap…" maxlength="60"></label>
<label class="w">Bio breve (directory)<input name="bio_short" maxlength="160"></label>
<label class="w">Biografia completa<textarea name="bio" rows="5" maxlength="2000"></textarea></label>
<label>URL fotografia<input name="photo_url" type="url" placeholder="https://…"></label>
<label>Instagram<input name="instagram" type="url"></label><label>Spotify<input name="spotify" type="url"></label><label>YouTube<input name="youtube" type="url"></label>
<label>Contatto booking<input name="contact" maxlength="120"></label>
<label>Stato progetto<select name="status"><option>In scrittura</option><option>In studio</option><option>Pronto a uscire</option><option>Attivo</option></select></label>
<div class="row w"><button class="btn">Salva profilo</button><button type="button" class="btn o" id="pub">Richiedi pubblicazione in Directory</button></div>
<p id="pubState" class="w small"></p></form>
<div id="recent"></div></section></template>

<template id="v-planner"><section><h2>Release planner</h2><div id="gate"></div>
<form id="relForm" class="cols" hidden><label>Titolo<input name="title" required maxlength="100"></label>
<label>Tipo<select name="type"><option>Singolo</option><option>EP</option><option>Album</option><option>Videoclip</option><option>Campagna</option></select></label>
<label>Data<input type="date" name="release_date" required></label>
<label>Stato<select name="status"><option>In preparazione</option><option>Programmata</option><option>Pubblicata</option></select></label>
<label class="w check"><input type="checkbox" name="is_public" checked> Mostra nel Release Radar (solo se il profilo è pubblico)</label>
<button class="btn">Aggiungi</button></form><div id="rels" class="list"></div></section></template>

<template id="v-presskit"><section><h2>Press kit</h2><div id="gate"></div>
<div id="kit" hidden><div class="row noprint"><button class="btn" id="print">Stampa / salva PDF</button><a class="btn o" href="#/dashboard">Modifica dati</a></div><article id="kitDoc" class="kit"></article></div></section></template>

<template id="v-directory"><section><h2>Artist directory</h2><div id="dir" class="grid3"></div></section></template>
<template id="v-radar"><section><h2>Release radar</h2><div id="rad" class="list"></div></section></template>

<template id="v-promotion"><section><h2>NVGP Promotion</h2><p class="lead2">Servizi editoriali soggetti a valutazione e disponibilità. Nessun risultato, stream o follower garantito.</p>
<div class="grid3"><div class="card"><h3>Post &amp; Story</h3><p>Presentazione del progetto sui canali Instagram NVGP.</p></div>
<div class="card hl"><h3>No Cap</h3><p>Post dedicato, contenuto lyrics su Instagram e TikTok, proposta playlist secondo disponibilità.</p></div>
<div class="card"><h3>Video &amp; Lyrics</h3><p>Formati verticali per accompagnare la release.</p></div></div>
<div class="split"><div><h3>Candidatura</h3><div id="tally"></div></div>
<form id="infoForm"><h3>Richiedi informazioni</h3><input type="hidden" name="access_key" id="w3k"><input type="checkbox" name="botcheck" hidden>
<label>Nome<input name="name" required></label><label>Email<input name="email" type="email" required></label>
<label>Messaggio<textarea name="message" rows="4" required></textarea></label><div id="ts"></div>
<button class="btn">Invia</button><a class="lnk" href="https://www.instagram.com/nvgp.team/">Scrivici su Instagram</a></form></div></section></template>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/app.js"></script></body></html>
